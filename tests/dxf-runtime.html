<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>DXF runtime gate test</title></head>
<body data-status="RUNNING"><pre id="result">RUNNING</pre>
<script src="../js/symbols.js"></script>
<script src="../js/design-model.js"></script>
<script src="../js/drawing-skill.js"></script>
<script src="../js/vendors.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/draw-cooling.js"></script>
<script src="../js/dxf-export.js"></script>
<script>
(function () {
  'use strict';
  const output = document.getElementById('result');
  try {
    const R = AIDC_ENGINE.build({
      projName: 'DXF运行测试', region: '上海', tier: 'tier3', gpuType: 'h100', gpuCount: 800,
      itLoad: 12000, voltage: '10', redundancy: '2n1', cooling: 'liquid', pueTarget: 1.25,
      rackPower: 40, gridScMva: 500, txUkPct: 6, upsBackupMin: 15, cduUnitKw: 500,
      supplyTemp: 35, returnTemp: 45, pricePeak: 1.05, priceValley: 0.35
    });
    const raw = drawCooling(R);
    let unauditedBlocked = false;
    try { AIDC_DXF.exportSvg(raw, { title: 'unaudited' }); }
    catch (error) { unauditedBlocked = /DRAWING_AUDIT_REQUIRED/.test(String(error && error.message)); }
    const audit = AIDC_DRAWING_SKILL.auditMarkup(raw, 'cooling-pid', R);
    AIDC_DRAWING_SKILL.recordDrawingAudit(R, 'cooling-pid', audit);
    const stamped = raw.replace('<svg ', '<svg data-drawing-audit-status="CHECKED" data-drawing-audit-version="1.0.0" ');
    const converted = AIDC_DXF.exportSvg(stamped, { title: 'audited' });
    const pass = audit.status === 'CHECKED' && unauditedBlocked && /^\s*0\s*[\r\n]+SECTION/.test(converted.dxf) && converted.dxf.includes('AC1024') && converted.dxf.includes('AIDC-DXF-MANIFEST');
    const result = { pass, audit: audit.status, unauditedBlocked, dxfLength: converted.dxf.length, entities: converted.stats.entities, warnings: converted.warnings.length };
    document.body.dataset.status = pass ? 'PASS' : 'FAIL';
    output.textContent = JSON.stringify(result);
  } catch (error) {
    document.body.dataset.status = 'FAIL';
    output.textContent = JSON.stringify({ pass: false, error: String(error && error.stack || error) });
  }
})();
</script>
</body></html>
